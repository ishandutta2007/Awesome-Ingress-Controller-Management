<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#090d11"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; fill: url(#titleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 17px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .flow-line { stroke-dasharray: 8 8; animation: dash 20s linear infinite; }
    
    @keyframes dash {
      to {
        stroke-dashoffset: -200;
      }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Dynamic Network Background Mesh -->
  <g stroke="url(#lineGrad)" stroke-width="1.5">
    <line x1="100" y1="240" x2="300" y2="250" class="flow-line" />
    <line x1="300" y1="250" x2="600" y2="270" class="flow-line" />
    <line x1="600" y1="270" x2="900" y2="240" class="flow-line" />
    <line x1="900" y1="240" x2="1100" y2="260" class="flow-line" />
    
    <line x1="200" y1="50" x2="400" y2="40" class="flow-line" />
    <line x1="400" y1="40" x2="800" y2="50" class="flow-line" />
    <line x1="800" y1="50" x2="1000" y2="40" class="flow-line" />
  </g>

  <!-- Dynamic Animated Glow Orbs in Background -->
  <circle cx="150" cy="160" r="100" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1050" cy="160" r="110" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- Traffic Flow Nodes / Pills (Subtle Background Dynamics) -->
  <g transform="translate(100, 220)">
    <rect width="140" height="36" rx="18" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <circle cx="20" cy="18" r="6" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="23" class="badge-text">North-South</text>
  </g>

  <g transform="translate(520, 235)">
    <rect width="160" height="36" rx="18" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <circle cx="20" cy="18" r="6" fill="#818cf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="23" class="badge-text">Gateway API v1.1</text>
  </g>

  <g transform="translate(940, 220)">
    <rect width="150" height="36" rx="18" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1" opacity="0.8"/>
    <circle cx="20" cy="18" r="6" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="23" class="badge-text">eBPF &amp; Envoy</text>
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed Unobscured Title & Subtitle) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Icon / Shield Graphic -->
    <g transform="translate(0, -65)">
      <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
      <path d="M-10 -6 L0 -14 L10 -6 L10 6 L0 14 L-10 6 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="4" fill="#c084fc"/>
    </g>

    <!-- Main Title -->
    <text y="20" class="title">Awesome Ingress Controller Management</text>
    
    <!-- Subtitle -->
    <text y="54" class="subtitle">Curated Ecosystem of Kubernetes Ingress, Gateway API, Edge Proxies &amp; Traffic Controllers</text>
  </g>
</svg>
